name: Release dry run

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  NODE_ENV: test

jobs:
  package:
    name: Build clean consumer artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.13.1
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify repository
        run: |
          pnpm lint
          pnpm typecheck
          pnpm docs:check
          pnpm test
          pnpm build
          pnpm ci:workflows
          pnpm licenses:check
      - name: Inspect release state
        run: pnpm changeset status
      - name: Pack package
        run: |
          mkdir -p artifacts
          pnpm --filter native-epub-kit pack --pack-destination artifacts
          TARBALL="$(find artifacts -maxdepth 1 -name 'native-epub-kit-*.tgz' -print -quit)"
          test -n "$TARBALL"
          ! tar -tzf "$TARBALL" | grep -q '^package/android/build/'
      - name: Install in a clean consumer
        run: |
          TARBALL="$(find artifacts -maxdepth 1 -name 'native-epub-kit-*.tgz' -print -quit)"
          TARBALL="$(realpath "$TARBALL")"
          mkdir -p /tmp/native-epub-kit-consumer
          cd /tmp/native-epub-kit-consumer
          npm init --yes
          npm install --ignore-scripts --package-lock=false "$TARBALL" expo@~56.0.12 react@19.2.3 react-native@0.85.3
          node --input-type=module --eval "const sdk = await import('native-epub-kit'); if (typeof sdk.EpubReaderView !== 'function') process.exit(1);"
      - name: Upload dry-run package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-epub-kit-release-dry-run
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 7
