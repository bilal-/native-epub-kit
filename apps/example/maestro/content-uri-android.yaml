appId: com.bilal.nativeepubkit.example
---
- stopApp
- openLink: ${METRO_DEEP_LINK}
- tapOn:
    text: 'Open'
    optional: true
- tapOn:
    text: 'Open'
    optional: true
- tapOn:
    text: 'Continue'
    optional: true
- extendedWaitUntil:
    visible: '.*ready.*owned 1.*emissions 1.*'
    timeout: 20000
- tapOn:
    id: 'source-content'
- extendedWaitUntil:
    visible: '.*android.*ready.*owned 1.*emissions 1.*'
    timeout: 20000
- extendedWaitUntil:
    visible: '.*android.*session active 1.*assets 0.*publications 1.*violations 0.*'
    timeout: 10000
- takeScreenshot: android-content-uri-ready
- tapOn:
    id: 'source-remote'
- extendedWaitUntil:
    visible: '.*android.*error.*UNSUPPORTED_FORMAT.*source.*owned 0.*emissions 1.*'
    timeout: 10000
- extendedWaitUntil:
    visible: '.*android.*session active 0.*assets 0.*publications 0.*violations 0.*'
    timeout: 10000
- tapOn:
    id: 'source-valid'
- extendedWaitUntil:
    visible: '.*android.*ready.*owned 1.*emissions 1.*'
    timeout: 20000
- takeScreenshot: android-content-uri-remote-recovery
