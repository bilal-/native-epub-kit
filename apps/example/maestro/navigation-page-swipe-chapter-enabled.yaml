appId: com.bilal.nativeepubkit.example
---
- stopApp
- openLink: ${METRO_DEEP_LINK}
- tapOn:
    text: 'Open'
    optional: true
- tapOn:
    text: 'Continue'
    optional: true
- tapOn:
    text: 'Close'
    optional: true
- tapOn:
    text: '.*:8083.*'
    optional: true
- setOrientation: PORTRAIT
- tapOn:
    id: 'source-valid'
- extendedWaitUntil:
    visible:
      id: 'reader-state'
      text: '.*ready.*owned 1.*emissions 1.*'
    timeout: 30000
- tapOn:
    id: 'fixture-stress'
- extendedWaitUntil:
    visible: '.*publication Annotation Stress Fixture.*'
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: 'reader-state'
      text: '.*ready.*owned 1.*emissions 1.*'
    timeout: 30000
- tapOn:
    id: 'toggle-navigation-layout'
- extendedWaitUntil:
    visible: '.*policy paginated/ltr.*page enabled.*chapter disabled.*'
    timeout: 30000
- tapOn:
    id: 'toggle-chapter-gesture'
- extendedWaitUntil:
    visible:
      id: 'reader-state'
      text: '.*ready.*owned 1.*emissions 1.*'
    timeout: 30000
- extendedWaitUntil:
    visible: '.*policy paginated/ltr.*page enabled.*chapter enabled.*'
    timeout: 30000
- tapOn:
    id: 'reset-gesture-location'
- extendedWaitUntil:
    visible: '.*gesture reset yes.*stress.xhtml.*'
    timeout: 15000
- tapOn:
    id: 'arm-gesture-anchor'
- tapOn:
    id: 'reader-focus'
- assertVisible:
    id: 'reader-focus-mode'
- waitForAnimationToEnd
- swipe:
    start: '82%,70%'
    end: '18%,70%'
    duration: 500
- waitForAnimationToEnd
- tapOn:
    id: 'settle-gesture-input'
- extendedWaitUntil:
    visible: 'gesture settlement complete'
    timeout: 5000
- tapOn:
    id: 'reader-unfocus'
- tapOn:
    id: 'verify-gesture-movement'
- extendedWaitUntil:
    visible: '.*gesture moved yes.*resource same yes.*'
    timeout: 15000
- takeScreenshot: navigation-page-swipe-chapter-enabled
