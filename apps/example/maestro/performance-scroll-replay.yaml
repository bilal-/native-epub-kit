appId: com.bilal.nativeepubkit.example
---
- tapOn:
    id: 'arm-scroll-performance'
- extendedWaitUntil:
    visible: 'PERFORMANCE_SCROLL_ARMED'
    timeout: 10000
- repeat:
    times: 6
    commands:
      - swipe:
          start: 50%, 85%
          end: 50%, 35%
          duration: 450
- repeat:
    times: 6
    commands:
      - swipe:
          start: 50%, 35%
          end: 50%, 85%
          duration: 450
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: 'finish-scroll-performance'
- extendedWaitUntil:
    visible: 'PERFORMANCE_PASS'
    timeout: 30000
- assertNotVisible: 'PERFORMANCE_FAIL'
