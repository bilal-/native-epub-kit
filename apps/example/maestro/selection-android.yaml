appId: com.bilal.nativeepubkit.example
---
- stopApp
- openLink: ${METRO_DEEP_LINK}
- launchApp
- tapOn:
    text: 'Open'
    optional: true
- tapOn:
    text: 'Continue'
    optional: true
- tapOn:
    text: '.*:8083.*'
    optional: true
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible:
      id: 'fixture-rtl'
    timeout: 20000
- tapOn:
    id: 'typography-hybrid'
- extendedWaitUntil:
    visible: '.*ready.*owned 1.*emissions 1.*'
    timeout: 20000
- tapOn:
    id: 'fixture-rtl'
- extendedWaitUntil:
    visible: '.*ready.*owned 1.*emissions 1.*'
    timeout: 20000
- extendedWaitUntil:
    visible: '.*hybrid.*loaded yes.*marker hybrid.*locator stable.*'
    timeout: 30000
- tapOn:
    id: 'reader-focus'
- assertVisible:
    id: 'reader-focus-mode'
- waitForAnimationToEnd
- longPressOn:
    point: '65%,39%'
- extendedWaitUntil:
    visible: 'Highlight'
    timeout: 10000
- tapOn: 'Highlight'
- extendedWaitUntil:
    visible: '.*android.*highlight.*selection .+.*direction rtl.*copy allowed.*truncated no.*visible clipped.*spaces consistent.*handles retained.*command selection.*locator.*urdu-reading.xhtml.*'
    timeout: 10000
- assertVisible: '.*android.*lifecycle started.*selection active.*handles retained.*'
- assertVisible:
    id: 'selection-marker'
- takeScreenshot: selection-android-portrait
- tapOn:
    id: 'clear-selection'
- assertNotVisible:
    id: 'selection-marker'
- assertVisible: 'Selection action pending'
- assertVisible: '.*android.*lifecycle cleared.*selection none.*handles released.*'
