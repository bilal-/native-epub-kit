appId: com.bilal.nativeepubkit.example
---
- stopApp
- openLink: ${METRO_DEEP_LINK}
- tapOn:
    text: 'Open'
    optional: true
- tapOn:
    text: 'Continue'
    optional: true
- tapOn:
    text: 'Close'
    optional: true
- tapOn:
    text: '.*:8083.*'
    optional: true
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible:
      id: 'reader-state'
      text: '.*ready.*owned 1.*emissions 1.*'
    timeout: 30000
- tapOn:
    id: 'toggle-navigation-layout'
- extendedWaitUntil:
    visible: '.*policy paginated/ltr.*page enabled.*chapter disabled.*'
    timeout: 30000
- tapOn:
    id: 'fixture-toc'
- extendedWaitUntil:
    visible: '.*publication Nested and Fragment TOC Fixture.*'
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: 'reader-state'
      text: '.*ready.*owned 1.*emissions 1.*'
    timeout: 30000
- tapOn:
    id: 'prepare-gesture-boundary'
- extendedWaitUntil:
    visible: '.*gesture boundary yes.*part-1.xhtml.*(0\.667|0\.750).*'
    timeout: 15000
- tapOn:
    id: 'arm-gesture-anchor'
- extendedWaitUntil:
    visible: '.*gesture anchor armed.*part-1.xhtml.*(0\.667|0\.750).*'
    timeout: 15000
- tapOn:
    id: 'reader-focus'
- assertVisible:
    id: 'reader-focus-mode'
- waitForAnimationToEnd
- swipe:
    start: '82%,70%'
    end: '18%,70%'
    duration: 500
- waitForAnimationToEnd
- tapOn:
    id: 'settle-gesture-input'
- extendedWaitUntil:
    visible: 'gesture settlement complete'
    timeout: 5000
- tapOn:
    id: 'reader-unfocus'
- tapOn:
    id: 'verify-gesture-movement'
- extendedWaitUntil:
    visible: '.*gesture moved no.*resource same yes.*'
    timeout: 15000
- takeScreenshot: navigation-boundary-swipe-chapter-disabled
