appId: com.bilal.nativeepubkit.example
---
- stopApp
- openLink: ${METRO_DEEP_LINK}
- tapOn:
    text: 'Open'
    optional: true
- tapOn:
    text: 'Continue'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'corpus-smoke-status'
      text: 'Corpus smoke passed'
    timeout: 60000
- assertVisible:
    id: 'corpus-smoke-reader'
- takeScreenshot: corpus-smoke-passed
